server {
    listen 80;
    server_name marketing.addp.vn;

    # Chuyển hướng tự động sang HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name marketing.addp.vn;

    # Cấu hình SSL (Thay thế bằng đường dẫn chứng chỉ thực tế của bạn)
    ssl_certificate /etc/letsencrypt/live/marketing.addp.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketing.addp.vn/privkey.pem;

    root /var/www/marketing.addp.vn/dist;
    index index.html;

    # Hỗ trợ SPA Routing cho React/Vite (Tránh lỗi 404 khi tải lại trang con)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache cho các tệp tĩnh để tối ưu tốc độ
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Bảo mật cơ bản
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
